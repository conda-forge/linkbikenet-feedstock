schema_version: 1

context:
  python_min: "3.12"
  version: "0.10.0"

package:
  name: linkbikenet
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/linkbikenet/linkbikenet-${{ version }}.tar.gz
  sha256: f784f234f9e83e0e5699f9ed8013a5c5a93978f14fb1be144d1fc850d27c7623

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}
    - geopandas >=1
    - osmnx >=2
    - scipy
    - geojson
    - tqdm
    - bikenetlib

tests:
  - python:
      imports:
        - linkbikenet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: BikeNetKit Python package to link disconnected bicycle network components
  license: AGPL-3.0-only
  license_file: LICENSE
  homepage: https://bikenetkit.org/linkbikenet
  documentation: https://docs.bikenetkit.org/LinkBikeNet
  repository: https://github.com/BikeNetKit/LinkBikeNet

extra:
  recipe-maintainers:
    - mszell
